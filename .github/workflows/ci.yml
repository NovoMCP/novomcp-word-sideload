name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npm run validate-manifest

      - name: Package add-in
        run: npm run package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: novomcp-word-sideload-${{ github.sha }}
          path: novomcp-word-sideload-package.zip
          retention-days: 30
